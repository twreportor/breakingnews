<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>看膩X調查了嗎？十大懸案Youtuber推薦！</title>

    <!-- 1. 設定 Discord / IG / FB 抓取的 Open Graph 預覽標籤 -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Yahoo News" />
    <meta property="og:title" content="看膩X調查了嗎？十大懸案Youtuber推薦！" />
    <meta property="og:description" content="這幾位懸案Youtuber你最喜歡誰？" />
    
    <!-- 預覽縮圖網址（請替換為你想顯示的新聞圖片直連網址） -->
    <meta property="og:image" content="https://r2.uploads.tw/2026/11/X0wConm6pL.webp" />

    <!-- 2. 設定大圖預覽模式（讓 Discord 顯示為大張橫幅圖片） -->
    <meta name="twitter:card" content="summary_large_image" />
</head>

        window.location.replace("https://youtube.com/watch?v=dFpdgEom2Sw");
    </script>
</body>
</html>
