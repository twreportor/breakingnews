<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>梁鳴富推薦好音樂網</title>

    <!-- 1. 設定 Discord / IG / FB 抓取的 Open Graph 預覽標籤 -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="狗熊日報" />
    <meta property="og:title" content="梁鳴富推薦好音樂網" />
    <meta property="og:description" content="我是梁鳴富，一名資深音樂愛好者，我的品味無須質疑，這裡分享的都是好音樂。" />
    
    <!-- 預覽縮圖網址（請替換為你想顯示的新聞圖片直連網址） -->
    <meta property="og:image" content="https://i.ibb.co/DHNvKJr5/1795144607599.jpg" />

    <!-- 2. 設定大圖預覽模式（讓 Discord 顯示為大張橫幅圖片） -->
    <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
    <p>新聞頁面載入中，請稍候...</p>

    <!-- 3. 給真人瀏覽器執行的跳轉語法（社群爬蟲不會執行此段 JS） -->
    <script>
        window.location.replace("https://youtube.com/watch?v=aePe3iAaxv0");
    </script>
</body>
</html>
